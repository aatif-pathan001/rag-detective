services:
  - type: web
    name: rag-detective
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python -c "from fastembed import TextEmbedding; TextEmbedding(model_name='BAAI/bge-small-en-v1.5')"
    startCommand: uvicorn rag_detective.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDING_DEVICE
        value: cpu
      - key: TOKENIZERS_PARALLELISM
        value: "false"
